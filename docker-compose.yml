name: aplikasi-pos

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # Default hanya bisa dibuka dari server itu sendiri (aman di belakang Nginx + HTTPS).
      # Untuk tes lokal dari HP di Wi-Fi yang sama, isi APP_PORT_BIND=0.0.0.0 di .env
      - "${APP_PORT_BIND:-127.0.0.1}:${APP_PORT:-8000}:8080"
    volumes:
      - storage_public:/var/www/html/storage/app/public   # foto menu
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  storage_public:
  storage_logs:
